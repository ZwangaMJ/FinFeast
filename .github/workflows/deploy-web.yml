name: Deploy web

# Every push to main runs CI, then publishes the tested web build
# to GitHub Pages: https://zwangamj.github.io/FinFeast/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Upload and publish run as separate jobs (GitHub's standard Pages setup).
  # In a single job, deploy-pages sometimes queried for the github-pages
  # artifact before GitHub listed it and failed with "No artifacts named
  # github-pages were found", even though the upload had succeeded.
  pages-artifact:
    name: pages-artifact
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: pages-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
