name: Android release

# Pushing a tag like v1.2.3 runs CI, builds a signed release APK on the runner
# (expo prebuild + Gradle, no EAS) and publishes it as a GitHub Release.
# "Run workflow" builds the same APK as a downloadable artifact, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apk:
    name: apk
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public by design (they ship in the app) and protected by row-level security.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # React Native 0.88 (Expo SDK 58) builds with JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions). See README → Android APK."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the repository variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

      # Tag builds take their version from the tag; manual builds keep app.json's version.
      - name: Set app version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/set-android-version.mjs "${GITHUB_REF_NAME}"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$(node -p "require('./app.json').expo.version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # android/ is generated (Continuous Native Generation) and never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The injected signing properties replace prebuild's debug signing for this build.
      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify the signature and package the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key, not the release keystore."
            exit 1
          fi
          mkdir -p release
          cp "$apk" "release/FinFeast-${VERSION}.apk"
          (cd release && sha256sum "FinFeast-${VERSION}.apk" > "FinFeast-${VERSION}.apk.sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release/
          retention-days: 14

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install on Android

          1. On your phone, download **FinFeast-${VERSION}.apk** below.
          2. Open it. If Android asks, allow your browser or file manager to install unknown apps.
          3. Installing over an earlier version keeps your data; you stay signed in.

          Check the download with the \`.sha256\` file: \`sha256sum -c FinFeast-${VERSION}.apk.sha256\`.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FinFeast $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
